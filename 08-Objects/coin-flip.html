<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flip</title>
</head>
<body>
    <button onclick="

    let randomNumber = randomNumberGenerator();

    console.log(randomNumber)

    playGame(randomNumber, 'heads');


    
    ">Heads</button>
    <button onclick="
    let randomNumber = randomNumberGenerator();

     console.log(randomNumber)

    playGame(randomNumber, 'tails');
    
    ">Tales</button>




    <button onclick="

    score.wins = 0;
    score.losses = 0;
    score.ties = 0;
    
    localStorage.removeItem('score')
    
    
    ">Reset Score</button>
    
    <script>



        
        
        let score = JSON.parse(localStorage.getItem('score')) ||  {
                wins:0,
                losses: 0,
                ties: 0
            };

        /*
        if(score === null){
            score = {
                wins:0,
                losses: 0,
                ties: 0
            }
        }
            */
        function randomNumberGenerator(){
            return Math.floor(Math.random() * 2);
        }

        function playGame(randomNumber, playerMove){

            if (randomNumber === 0 && playerMove === 'heads'){

                score.losses += 1;

                alert(`You picked ${playerMove}. computer picked Heads. You Lose
                Wins :${score.wins}, Losses: ${score.losses}
                `)
                
            }
            else if (randomNumber === 1 && playerMove === 'heads'){

                score.wins += 1;
                 alert(`You picked ${playerMove}. computer picked Tails. You Win
            Wins : ${score.wins}, Losses: ${score.losses}
                `)


            }
            else if  (randomNumber === 1 && playerMove === 'tails'){

                  score.losses += 1; 
                alert(`You picked ${playerMove}. computer picked Tails. You Lose
                Wins :${score.wins}, Losses: ${score.losses}
                `)
            

            }
            else if (randomNumber === 0 && playerMove === 'tails'){

               

            
                 score.wins += 1;
                 alert(`You picked ${playerMove}. computer picked Heads. You Win
            Wins : ${score.wins}, Losses: ${score.losses}`)

            }

            
            localStorage.setItem('score', JSON.stringify(score));

        }

    </script>
</body>
</html>
