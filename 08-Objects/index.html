<body>
    <script>
       

        const product2 = {
            name: 'shirt',
            rating : {
                stars : 4.5,
                count: 87
            },
            fun: function function1(){
                console.log('hello')
            }
        }
        // console.log is a method just like product2.fun is a method,
        // console is the object and log is the function

        
        console.log(product2['name'])

        product2.fun();

        console.log(JSON.stringify(product2)); 

        const jsonString = JSON.stringify(product2);// converts the product2 into JSON

        console.log(JSON.parse(jsonString));

        /*
        JSON – Javascript object notation

        a syntax

        basically similar to javascripy obecject buts has less features
        like no use of funcitons 

        JSON can be understood by most programming language

        local storage – Save values more permenantly, so when you referesh a page, the contents 
        of variables will not get deleted 

        Both JSON and local storage are built in objects



        what is autoboxing = when a string or int can use methods by wrapping it in an invisible object

        an object is actually a refernce to its attributes

        */


        console.log('hello'.length)

        const object4 = {
            message: 'hello'

        }

        //const message = object4.message

        const {message} = object4;

        console.log(message)
