                        this.items[this.pointer1] > this.items[this.pointer2]

                    }
                
                
                }
           
                let left = quickSortAlgorithm(items.slice(0, pointer1));
                let right = quickSortAlgorithm(items.slice(pointer1 + 1));

                return left + this.items + right;
           
            }   

        }

       }
