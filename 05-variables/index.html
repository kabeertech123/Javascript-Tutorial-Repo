<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varaibles</title>
</head>
<body>
    
    <h1>Cart Quantity</h1>

    <button class="show-quantity-btn">Show Quantity</button>

    <button class="add-to-cart-btn">Add to Cart</button>
     
    <button class="plus2-increase-btn">+2</button>

    <button class="plus3-increase-btn">+3</button>

    <button class="reset-cart-btn">Reset Cart</button>

    




    <script>

        let cartQuantity = 0;

        const showQuantityBtn = document.querySelector(".show-quantity-btn");

        showQuantityBtn.addEventListener("click", function(){

            console.log(`Cart quantity: ${cartQuantity}`)

        } )

        const addToCartBtn = document.querySelector(".add-to-cart-btn");

        addToCartBtn.addEventListener("click", function(){

            cartQuantity += 1; // this updates the var rather than console.log(cartQuantity + 1);

            console.log(`Cart quantity: ${cartQuantity}`)

        } )

        const increaseBy2Btn = document.querySelector(".plus2-increase-btn");

        increaseBy2Btn.addEventListener("click", function(){

            cartQuantity += 2; 

            console.log(`Cart quantity: ${cartQuantity}`)

        } )

        const increaseBy3Btn = document.querySelector(".plus3-increase-btn");

        increaseBy3Btn.addEventListener("click", function(){

            cartQuantity += 3; 

           console.log(`Cart quantity: ${cartQuantity}`)

        } )

        const resetCartBtn = document.querySelector(".reset-cart-btn");

        resetCartBtn.addEventListener("click", function(){

            cartQuantity = 0; 

            console.log('Card quantity has been reset');

        } )

    


    </script>
</body>
</html>
